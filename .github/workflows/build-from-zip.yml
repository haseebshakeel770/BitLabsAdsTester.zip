name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          mkdir -p project
          unzip -q "$ZIP" -d project
          SETTINGS=$(find project -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found inside the ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> $GITHUB_ENV

      - name: Fix versions (AGP 8.7.3, compileSdk 35, Kotlin 2.1.20)
        run: |
          cat > "$PROJECT_DIR/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.1.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.20" apply false
          }
          EOF
          cat > "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'
          import java.util.Properties

          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          val localProps = Properties().apply {
              val f = rootProject.file("bitlabs.local.properties")
              if (f.exists()) f.inputStream().use { load(it) }
          }
          fun q(s: String) = "\"" + s.replace("\\", "\\\\").replace("\"", "\\\"") + "\""

          android {
              namespace = "com.example.bitlabstester"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.bitlabstester"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  buildConfigField("String", "DEFAULT_APP_TOKEN", q(localProps.getProperty("BITLABS_APP_TOKEN", "")))
                  buildConfigField("String", "DEFAULT_BACKEND_URL", q(localProps.getProperty("BACKEND_BASE_URL", "")))
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += "-Xskip-metadata-version-check"
              }
              buildFeatures {
                  compose = true
                  buildConfig = true
              }
              packaging {
                  resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
              }
          }

          dependencies {
              implementation("com.prodege.bitlabs:core:5.1.0")
              implementation("androidx.core:core-ktx:1.16.0")
              implementation("androidx.activity:activity-compose:1.10.1")
              implementation(platform("androidx.compose:compose-bom:2025.05.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
          }
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show real errors
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo '### Build errors' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -nE "^e: |What went wrong|Could not |error:|Unresolved|requires|minCompileSdk" -A4 build.log | head -60 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.PROJECT_DIR }}/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: BitLabsAdsTester-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
